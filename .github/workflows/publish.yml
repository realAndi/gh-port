name: build and publish repo

# Rebuilds the package for whatever cli/cli currently tags as its latest release
# and republishes the APT repo to GitHub Pages. There is no state to track: the
# package version mirrors upstream, so Sileo only sees a new version when GitHub
# actually ships one. Bump packaging/revision to force a rebuild (e.g. after a
# wrapper change) without waiting for upstream.
#
# The orchestration lives in realAndi/ios-port-ci and is shared with the other
# ports, so a change there -- a deprecated action, a new hardening step --
# reaches all of them at once instead of being applied N times and forgotten in
# the N+1th. This repository supplies only what is specific to gh: the three
# scripts in tools/ and everything in packaging/. See that repo's CONTRACT.md.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream gh tag to build (blank = latest release)"
        required: false
  push:
    branches: [main]
    paths: ["packaging/**", "tools/**", ".github/workflows/publish.yml"]

# The reusable workflow needs these, and a caller cannot grant more than it has.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A job that calls a reusable workflow is only `uses:`/`with:`/`secrets:` --
  # no steps of its own -- so everything below is inputs.
  publish:
    uses: realAndi/ios-port-ci/.github/workflows/publish.yml@v1
    with:
      package: com.andi.github-cli
      origin: gh-port
      label: GitHub CLI for iOS
      description: GitHub CLI, built natively for jailbroken iOS
      # tools/build-payload.sh needs Xcode's iPhoneOS SDK and ldid: the
      # ios/arm64 Go port links through clang, and only that clang emits a
      # Mach-O claiming platform 2. There is no way to produce this on Linux.
      needs-macos: true
      version: ${{ inputs.version || '' }}
    secrets:
      # Its own key, not the one that signs reallyitsandi.com and not
      # CCForiOS's, so a compromise of this repository's CI cannot forge
      # packages for the others.
      GPG_KEY: ${{ secrets.GHIOS_GPG_KEY }}
      GPG_KEY_ID: ${{ secrets.GHIOS_GPG_KEY_ID }}
